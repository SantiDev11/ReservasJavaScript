<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>RestoApp · Sistema de Reservas y Operaciones</title>
  <meta name="description" content="Sistema de reservas, comandas, cocina y despachos con control de acceso por roles.">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

  <section id="loginView" aria-label="Pantalla de Inicio de Sesión">
    <div class="login-bg-glow login-bg-glow-1"></div>
    <div class="login-bg-glow login-bg-glow-2"></div>
    <div class="login-bg-glow login-bg-glow-3"></div>

    <main class="login-card" id="loginCard">
      <header class="login-brand">
        <div class="login-logo-icon">
          <i class="fas fa-utensils"></i>
        </div>
        <h1>Resto<span>App</span></h1>
        <p>Sistema Integral de Reservas &amp; Operaciones</p>
      </header>

      <div id="googleSignInBtn" class="google-auth-container"></div>

      <div id="googleAuthStatus" class="google-auth-status" style="display:none;"></div>

      <section id="localAccessBlock" aria-label="Acceso con credenciales locales">
        <div class="login-divider">
          <span>O CON CREDENCIALES</span>
        </div>

        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label for="loginUser">Usuario o Correo Electrónico</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="loginUser"
                class="form-control"
                placeholder="admin, mesero, cocina, despacho o email"
                required
                autocomplete="username"
              >
              <i class="fas fa-user input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="loginPass">Contraseña</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="loginPass"
                class="form-control"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              >
              <i class="fas fa-lock input-icon"></i>
              <button type="button" class="toggle-password" id="togglePassword" title="Mostrar/Ocultar contraseña">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary login-btn-submit" id="submitBtn">
            <span>Ingresar al Sistema</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </form>

        <div class="role-quick-select">
          <div class="role-quick-title">Acceso Rápido de Prueba (1-Clic)</div>
          <div class="role-pills">
            <button type="button" class="role-pill-btn" data-role="admin">
              <i class="fas fa-user-shield"></i>
              <span>Admin</span>
            </button>
            <button type="button" class="role-pill-btn" data-role="mesero">
              <i class="fas fa-concierge-bell"></i>
              <span>Mesero</span>
            </button>
            <button type="button" class="role-pill-btn" data-role="cocina">
              <i class="fas fa-fire-burner"></i>
              <span>Cocina</span>
            </button>
            <button type="button" class="role-pill-btn" data-role="despacho">
              <i class="fas fa-truck"></i>
              <span>Despacho</span>
            </button>
          </div>
        </div>
      </section>

      <footer class="login-footer-info">
        <i class="fas fa-shield-alt"></i>
        <span>Sesión validada en cada operación y control de acceso por roles</span>
      </footer>
    </main>
  </section>

  <section id="dashboardView" aria-label="Panel Principal" hidden>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header">
        <div class="sidebar-logo-icon">
          <i class="fas fa-utensils"></i>
        </div>
        <h2>Resto<span>App</span></h2>
      </header>

      <nav class="sidebar-menu" id="menuContainer" aria-label="Menú principal"></nav>

      <footer class="sidebar-footer">
        <div class="user-profile-widget">
          <div class="user-avatar" id="userAvatarDisplay">A</div>
          <div class="user-details">
            <div class="user-name" id="userNameDisplay">Usuario</div>
            <div class="user-role-label" id="userRoleDisplay">Rol</div>
          </div>
        </div>
        <button class="logout-btn" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i>
          <span>Cerrar Sesión</span>
        </button>
      </footer>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menú lateral">
            <i class="fas fa-bars"></i>
          </button>
          <h2 id="viewTitle">Panel de Control</h2>
        </div>

        <div class="topbar-right">
          <div class="live-clock">
            <i class="far fa-clock"></i> <span id="liveClock">--:--</span>
          </div>
          <span class="badge badge-administrador" id="roleBadge">ADMINISTRADOR</span>
        </div>
      </header>

      <main class="page-content" id="pageContent"></main>
    </div>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modalContent" role="dialog" aria-modal="true">
        <div class="modal-header">
          <h3 id="modalTitle">Modal</h3>
          <button class="close-modal" id="modalCloseBtn" aria-label="Cerrar modal">&times;</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>
  </section>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
